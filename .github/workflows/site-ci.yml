name: site-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false

      - name: Verify candidate checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Verify immutable diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Install frozen dependencies
        run: npm ci

      - name: Build production Astro site
        run: npm run build

      - name: Install pinned Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Exercise built pages in narrow and desktop browsers
        run: npm test

      - name: Verify generated site contract
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/adopt/index.html
          test -s dist/packages/index.html
          test -s dist/testing/index.html
          if grep -R -n -E '<<<<<<<|=======|>>>>>>>' src package.json .zpkg.toml astro.config.mjs; then
            echo 'unresolved conflict marker found' >&2
            exit 1
          fi

      - name: Verify package identity parity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const zpkg = readFileSync('.zpkg.toml', 'utf8');
          const pick = (key) => zpkg.match(new RegExp(`^${key}\\s*=\\s*"([^"]+)"`, 'm'))?.[1];
          if (pkg.name !== 'owls-site') throw new Error(`package name=${pkg.name}`);
          if (pick('name') !== pkg.name) throw new Error('package/.zpkg name drift');
          if (pick('version') !== pkg.version) throw new Error('package/.zpkg version drift');
          if (!zpkg.includes('org = "ores-wasm-loaders"')) throw new Error('wrong .zpkg org');
          if (!zpkg.includes('url = "https://github.com/ores-wasm-loaders/ores-wasm-loaders.github.io"')) {
            throw new Error('wrong .zpkg repository identity');
          }
          NODE

      - name: Verify publish contents stay bounded
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node --input-type=module - "$RUNNER_TEMP/pack.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(process.argv[2], 'utf8'))[0];
          const files = receipt.files.map((item) => item.path);
          for (const forbidden of ['node_modules/', 'dist/', '.astro/', '.git/', '.tools/', 'tmp/', 'temp/', 'test-results/', 'playwright-report/']) {
            if (files.some((path) => path.startsWith(forbidden))) {
              throw new Error(`forbidden packed path: ${forbidden}`);
            }
          }
          if (!files.includes('package.json')) throw new Error('package.json missing from pack');
          NODE
